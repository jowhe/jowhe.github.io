name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is checked by the deploy workflow before it publishes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Build before typecheck: the build generates the Next.js route types tsc relies on.
      - run: pnpm build

      - run: pnpm typecheck
